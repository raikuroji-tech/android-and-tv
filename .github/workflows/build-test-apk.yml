name: Build test APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -v -keystore ci-test.jks -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass testpass123 -keypass testpass123 -dname "CN=Test"
          printf 'storeFile=ci-test.jks\nstorePassword=testpass123\nkeyAlias=ci\nkeyPassword=testpass123\n' > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleMobileRelease --max-workers=2 --no-configuration-cache --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Anilife-release-apk
          path: app/build/outputs/apk/mobile/release/*.apk
          retention-days: 14
